name: Deploy Core Web Vitals Report

on:
  push:
    branches: [ main ]
  workflow_dispatch:
  schedule:
    - cron: '0 8 1 * *'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Fetch Canyon Mobile Data
        env:
          CRUX_API_KEY: ${{ secrets.CRUX_API_KEY }}
        run: |
          export ORIGIN='https://www.canyon.com'
          export DEVICE='PHONE'
          export OUTPUT_FILE='data/history-phone.json'
          node fetch_history.js

      - name: Fetch Canyon Desktop Data
        env:
          CRUX_API_KEY: ${{ secrets.CRUX_API_KEY }}
        run: |
          export ORIGIN='https://www.canyon.com'
          export DEVICE='DESKTOP'
          export OUTPUT_FILE='data/history-desktop.json'
          node fetch_history.js

      - name: Fetch Specialized Mobile Data
        env:
          CRUX_API_KEY: ${{ secrets.CRUX_API_KEY }}
        run: |
          export ORIGIN='https://www.specialized.com'
          export DEVICE='PHONE'
          export OUTPUT_FILE='data/specialized-phone.json'
          node fetch_history.js

      - name: Fetch Specialized Desktop Data
        env:
          CRUX_API_KEY: ${{ secrets.CRUX_API_KEY }}
        run: |
          export ORIGIN='https://www.specialized.com'
          export DEVICE='DESKTOP'
          export OUTPUT_FILE='data/specialized-desktop.json'
          node fetch_history.js

      - name: Fetch Rose Mobile Data
        env:
          CRUX_API_KEY: ${{ secrets.CRUX_API_KEY }}
        run: |
          export ORIGIN='https://www.rosebikes.de'
          export DEVICE='PHONE'
          export OUTPUT_FILE='data/rose-phone.json'
          node fetch_history.js

      - name: Fetch Rose Desktop Data
        env:
          CRUX_API_KEY: ${{ secrets.CRUX_API_KEY }}
        run: |
          export ORIGIN='https://www.rosebikes.de'
          export DEVICE='DESKTOP'
          export OUTPUT_FILE='data/rose-desktop.json'
          node fetch_history.js

      - name: Commit updated data
        run: |
          git add data/
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update CrUX data [$(date -I)]"
            git push
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
