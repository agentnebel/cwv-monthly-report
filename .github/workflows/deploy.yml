name: Deploy Canyon CWV Report

on:
  push:
    branches: [ main ]
  workflow_dispatch:
  schedule:
    - cron: '0 8 1 * *'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch Canyon Mobile Data
        env:
          CRUX_API_KEY: ${{ secrets.CRUX_API_KEY }}
        run: |
          export ORIGIN='https://www.canyon.com'
          export DEVICE='PHONE'
          export OUTPUT_FILE='data/history-phone.json'
          node fetch_history.js

      - name: Fetch Canyon Desktop Data
        env:
          CRUX_API_KEY: ${{ secrets.CRUX_API_KEY }}
        run: |
          export ORIGIN='https://www.canyon.com'
          export DEVICE='DESKTOP'
          export OUTPUT_FILE='data/history-desktop.json'
          node fetch_history.js

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .
          publish_branch: gh-pages
          force_orphan: true
