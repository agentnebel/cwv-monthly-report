name: Manual Fetch

on:
  workflow_dispatch:
    inputs:
      origin:
        description: 'Origin URL (e.g., https://www.canyon.com)'
        required: true
        default: 'https://www.canyon.com'
      device:
        description: 'Device type'
        required: true
        default: 'PHONE'
        type: choice
        options:
          - PHONE
          - DESKTOP
          - TABLET

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Update config
        run: |
          sed -i "s|origin: '.*'|origin: '${{ github.event.inputs.origin }}'|" fetch_history.js
          sed -i "s/formFactor: '.*'/formFactor: '${{ github.event.inputs.device }}'" fetch_history.js
      
      - name: Fetch data
        env:
          CRUX_API_KEY: ${{ secrets.CRUX_API_KEY }}
        run: node fetch_history.js
      
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git commit -m "Manual update: ${{ github.event.inputs.origin }} (${{ github.event.inputs.device }})" || echo "No changes"
          git push
