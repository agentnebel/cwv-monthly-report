name: Fetch Monthly CWV Data

on:
  # Run automatically on the 1st of every month at 08:00 UTC
  schedule:
    - cron: '0 8 1 * *'
  # Run on every push to main branch
  push:
    branches: [ "main" ]
  # Allow manual trigger
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  fetch-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # CANYON FETCHES
      - name: Fetch CrUX Data (Canyon Mobile)
        env:
          CRUX_API_KEY: ${{ secrets.CRUX_API_KEY }}
          ORIGIN: 'https://www.canyon.com'
          DEVICE: PHONE
          OUTPUT_FILE: data/history-phone.json
        run: node fetch_history.js

      - name: Fetch CrUX Data (Canyon Desktop)
        env:
          CRUX_API_KEY: ${{ secrets.CRUX_API_KEY }}
          ORIGIN: 'https://www.canyon.com'
          DEVICE: DESKTOP
          OUTPUT_FILE: data/history-desktop.json
        run: node fetch_history.js

      # SPECIALIZED FETCHES
      - name: Fetch CrUX Data (Specialized Mobile)
        env:
          CRUX_API_KEY: ${{ secrets.CRUX_API_KEY }}
          ORIGIN: 'https://www.specialized.com'
          DEVICE: PHONE
          OUTPUT_FILE: data/specialized-phone.json
        run: node fetch_history.js

      - name: Fetch CrUX Data (Specialized Desktop)
        env:
          CRUX_API_KEY: ${{ secrets.CRUX_API_KEY }}
          ORIGIN: 'https://www.specialized.com'
          DEVICE: DESKTOP
          OUTPUT_FILE: data/specialized-desktop.json
        run: node fetch_history.js

      - name: Archive old data
        run: |
          mkdir -p archive
          if [ -f data/history-phone.json ]; then cp data/history-phone.json archive/history-phone-$(date +%Y%m%d).json; fi
          if [ -f data/history-desktop.json ]; then cp data/history-desktop.json archive/history-desktop-$(date +%Y%m%d).json; fi
          if [ -f data/specialized-phone.json ]; then cp data/specialized-phone.json archive/specialized-phone-$(date +%Y%m%d).json; fi
          if [ -f data/specialized-desktop.json ]; then cp data/specialized-desktop.json archive/specialized-desktop-$(date +%Y%m%d).json; fi

      - name: Commit and Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ archive/
          # Commit only if changes exist
          git diff --quiet && git diff --staged --quiet || git commit -m "Update CWV data (Mobile & Desktop) - $(date +%Y-%m-%d)"
          git push

      - name: Copy data to docs folder
        run: |
          mkdir -p docs
          cp -r data docs/
          cp index.html docs/

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
          keep_files: false
