name: Fetch Monthly CWV Data

on:
  schedule:
    - cron: '0 8 1 * *'
  push:
    branches: [ "main" ]
  workflow_dispatch:

# Grant GITHUB_TOKEN the permissions to deploy to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  fetch-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # CANYON
      - name: Fetch Canyon Mobile
        env:
          CRUX_API_KEY: ${{ secrets.CRUX_API_KEY }}
          ORIGIN: 'https://www.canyon.com'
          DEVICE: PHONE
          OUTPUT_FILE: data/history-phone.json
        run: node fetch_history.js

      - name: Fetch Canyon Desktop
        env:
          CRUX_API_KEY: ${{ secrets.CRUX_API_KEY }}
          ORIGIN: 'https://www.canyon.com'
          DEVICE: DESKTOP
          OUTPUT_FILE: data/history-desktop.json
        run: node fetch_history.js

      # SPECIALIZED
      - name: Fetch Specialized Mobile
        env:
          CRUX_API_KEY: ${{ secrets.CRUX_API_KEY }}
          ORIGIN: 'https://www.specialized.com'
          DEVICE: PHONE
          OUTPUT_FILE: data/specialized-phone.json
        run: node fetch_history.js

      - name: Fetch Specialized Desktop
        env:
          CRUX_API_KEY: ${{ secrets.CRUX_API_KEY }}
          ORIGIN: 'https://www.specialized.com'
          DEVICE: DESKTOP
          OUTPUT_FILE: data/specialized-desktop.json
        run: node fetch_history.js

      # DEBUG
      - name: Debug - List Files
        run: ls -R data/

      # Setup Pages
      - name: Setup Pages
        uses: actions/configure-pages@v4
      
      # Upload Artifact (Official Way)
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Upload entire repository (excluding .git)
          # We need to make sure index.html is in root
          path: '.'

      # Deploy to Pages
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
